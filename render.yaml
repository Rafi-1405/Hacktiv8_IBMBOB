# render.yaml — Render IaaC configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: autospec-qa
    runtime: python
    region: singapore          # closest to Indonesia; change to e.g. oregon for US
    plan: free                 # Render free tier (spins down after 15 min idle)

    # Directory containing main.py
    rootDir: .

    # Install dependencies
    buildCommand: pip install -r requirements.txt

    # Start the FastAPI app with production settings
    # --host 0.0.0.0  → listen on all interfaces (required by Render)
    # $PORT            → Render injects the PORT environment variable
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # Environment variables — set the secret value in Render dashboard,
    # not here. Only list the key names.
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # marks it as a secret; value set in dashboard only
      - key: PYTHON_VERSION
        value: 3.11.0

    # Health check so Render knows the app is ready
    healthCheckPath: /health
